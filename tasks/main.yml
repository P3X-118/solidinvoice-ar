---
- name: Perform SolidInvoice installation tasks
  when: solidinvoice_enabled | bool
  tags:
    - setup-all
    - setup-solidinvoice
    - install-all
    - install-solidinvoice
  block:
    - name: Validate SolidInvoice configuration
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/validate_config.yml"
    - name: Install SolidInvoice
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/install.yml"

- name: Perform tasks to print database credentials for SolidInvoice
  when: solidinvoice_enabled | bool
  tags:
    - print-db-credentials-solidinvoice
  block:
    - name: Print database credentials for SolidInvoice
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/print_db_credentials.yml"

- name: Perform tasks to add `trusted_host_patterns`
  when: solidinvoice_enabled | bool
  tags:
    - trusted-host-solidinvoice
  block:
    - name: Run a command for adding SolidInvoice hostname to `trusted_host_patterns` on settings.php
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/trusted_host_patterns.yml"

- name: Perform SolidInvoice uninstallation tasks
  when: not solidinvoice_enabled | bool
  tags:
    - setup-all
    - setup-solidinvoice
  block:
    - name: Uninstall SolidInvoice
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/uninstall.yml"
