---
- name: Check existence of SolidInvoice systemd service
  ansible.builtin.stat:
    path: "{{ devture_systemd_docker_base_systemd_path }}/{{ solidinvoice_identifier }}.service"
  register: solidinvoice_service_stat

- name: Uninstall SolidInvoice systemd services and files
  when: solidinvoice_service_stat.stat.exists | bool
  block:
    - name: Ensure SolidInvoice systemd service is stopped
      ansible.builtin.service:
        name: "{{ solidinvoice_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure SolidInvoice systemd service does not exist
      ansible.builtin.file:
        path: "{{ devture_systemd_docker_base_systemd_path }}/{{ solidinvoice_identifier }}.service"
        state: absent

    - name: Ensure SolidInvoice support files do not exist
      ansible.builtin.file:
        path: "{{ solidinvoice_base_path }}/{{ item }}"
        state: absent
      with_items:
        - env
        - labels

    - name: Ensure SolidInvoice config path for Caddy inside the container does not exist
      ansible.builtin.file:
        path: "{{ solidinvoice_config_path }}"
        state: absent

    - name: Ensure SolidInvoice local path for Caddy inside the container does not exist
      ansible.builtin.file:
        path: "{{ solidinvoice_local_path }}"
        state: absent

    - name: Ensure SolidInvoice local data path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ solidinvoice_data_path }}"
      register: solidinvoice_data_path_deletion_result
      changed_when: solidinvoice_data_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure SolidInvoice base path does not exist if empty
      ansible.builtin.command:
        cmd: "rmdir {{ solidinvoice_base_path }}"
      register: solidinvoice_base_path_deletion_result
      changed_when: solidinvoice_base_path_deletion_result.rc == 0
      failed_when: false

    - name: Ensure SolidInvoice container network does not exist
      when: solidinvoice_container_network_deletion_enabled
      block:
        - name: Ensure SolidInvoice container network does not exist via community.docker.docker_network
          when: devture_systemd_docker_base_container_network_creation_method == 'ansible-module'
          community.docker.docker_network:
            name: "{{ solidinvoice_container_network }}"
            state: absent
          register: solidinvoice_network_deletion_result

        - name: Ensure SolidInvoice container network does not exist via ansible.builtin.command
          when: devture_systemd_docker_base_container_network_creation_method == 'command'
          ansible.builtin.command:
            cmd: >-
              {{ devture_systemd_docker_base_host_command_docker }} network rm
              {{ solidinvoice_container_network }}
          register: solidinvoice_network_deletion_result
          changed_when: solidinvoice_container_network in solidinvoice_network_deletion_result.stdout

- name: Check existence of SolidInvoice local data path
  ansible.builtin.stat:
    path: "{{ solidinvoice_data_path }}"
  register: solidinvoice_data_path_stat

# We just want to notify the user. Deleting data is too destructive.
- name: Notify if SolidInvoice local data remains
  when: solidinvoice_data_path_stat.stat.exists | bool
  ansible.builtin.set_fact:
    devture_playbook_runtime_messages_list: |
      {{
        devture_playbook_runtime_messages_list | default([])
        +
        [
          "Note: As the local SolidInvoice instance has been removed, some old data remains in `" + solidinvoice_data_path + "`. Feel free to delete it."
        ]
      }}
