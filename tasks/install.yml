---
- name: Ensure SolidInvoice paths exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: "{{ solidinvoice_uid }}"
    group: "{{ solidinvoice_gid }}"
  with_items:
    - "{{ solidinvoice_base_path }}"
    - "{{ solidinvoice_data_path }}"
    - "{{ solidinvoice_config_path }}"
    - "{{ solidinvoice_local_path }}"
    - "{{ solidinvoice_home_path }}"

- name: Ensure SolidInvoice support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ solidinvoice_base_path }}/{{ item }}"
    mode: "0640"
    owner: "{{ solidinvoice_uid }}"
    group: "{{ solidinvoice_gid }}"
  with_items:
    - env
    - labels
  register: solidinvoice_support_files_result

- name: Ensure SolidInvoice container image is pulled via community.docker.docker_image
  when: sysd_docker_image_pull_method == 'ansible-module'
  community.docker.docker_image:
    name: "{{ solidinvoice_container_image }}"
    source: "{{ 'pull' if ansible_version.major > 2 or ansible_version.minor > 7 else omit }}"
    force_source: "{{ solidinvoice_container_image_force_pull if ansible_version.major > 2 or ansible_version.minor >= 8 else omit }}"
    force: "{{ omit if ansible_version.major > 2 or ansible_version.minor >= 8 else solidinvoice_container_image_force_pull }}"
  register: solidinvoice_container_image_pull_result
  retries: "{{ container_retry }}"
  delay: "{{ container_retry_delay }}"
  until: solidinvoice_container_image_pull_result is not failed

- name: Ensure SolidInvoice container image is pulled via ansible.builtin.command
  when: sysd_docker_image_pull_method == 'command'
  ansible.builtin.command:
    cmd: "{{ sysd_docker_host_command }} pull {{ solidinvoice_container_image }}"
  register: solidinvoice_container_image_pull_result
  retries: "{{ container_retry }}"
  delay: "{{ container_retry_delay }}"
  until: solidinvoice_container_image_pull_result is not failed
  changed_when: "'Downloaded newer image' in solidinvoice_container_image_pull_result.stdout"

- name: Ensure SolidInvoice container network is created via community.docker.docker_network
  when: sysd_docker_net_creation_method == 'ansible-module'
  community.docker.docker_network:
    enable_ipv6: "{{ sysd_docker_ipv6_enabled }}"
    name: "{{ solidinvoice_container_network }}"
    driver: bridge
    driver_options: "{{ sysd_docker_net_driver_opts }}"
  register: solidinvoice_network_creation_result

- name: Ensure SolidInvoice container network is created via ansible.builtin.command
  when: sysd_docker_net_creation_method == 'command'
  ansible.builtin.command:
    cmd: >-
      {{ sysd_docker_host_command }} network create
      {% if sysd_docker_ipv6_enabled %}--ipv6{% endif %}
      {{ sysd_docker_net_driver_opts_string }}
      {{ solidinvoice_container_network }}
  register: solidinvoice_network_creation_result
  changed_when: solidinvoice_network_creation_result.rc == 0
  failed_when: solidinvoice_network_creation_result.rc != 0 and 'already exists' not in solidinvoice_network_creation_result.stderr

- name: Ensure SolidInvoice systemd service is present
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/solidinvoice.service.j2"
    dest: "{{ sysd_docker_service_path }}/{{ solidinvoice_identifier }}.service"
    mode: "0644"
  register: solidinvoice_systemd_service_result

- name: Determine whether SolidInvoice needs a restart
  ansible.builtin.set_fact:
    solidinvoice_restart_necessary: >-
      {{
        solidinvoice_support_files_result.changed | default(false)
        or solidinvoice_systemd_service_result.changed | default(false)
        or solidinvoice_container_image_pull_result.changed | default(false)
      }}
