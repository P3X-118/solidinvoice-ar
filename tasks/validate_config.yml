---
- name: Fail if required farmOS settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - farmos_uid
    - farmos_gid
    - farmos_hostname
    - farmos_path_prefix
    - farmos_container_network
    - farmos_database_type

- name: Fail if farmOS database type is invalid
  ansible.builtin.fail:
    msg: >-
      farmos_database_type must be 'mysql', 'postgres', or 'sqlite'.
  when: "farmos_database_type not in ['mysql', 'postgres', 'sqlite']"

- name: Fail if required farmOS + MySQL integration settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) when `farmos_database_type` is `mysql`
  when: "farmos_database_type == 'mysql' and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - farmos_database_mysql_hostname
    - farmos_database_mysql_password

- name: Fail if required farmOS + Postgres integration settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) when `farmos_database_type` is `postgres`
  when: "farmos_database_type == 'postgres' and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - farmos_database_postgres_hostname
    - farmos_database_postgres_password

- name: Run if Traefik is enabled
  when: farmos_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for farmOS are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - farmos_container_labels_traefik_hostname
        - farmos_container_labels_traefik_path_prefix

    - name: Fail if farmos_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          farmos_container_labels_traefik_path_prefix (`{{ farmos_container_labels_traefik_path_prefix }}`) must be `/`.
          farmOS does not support hosting under a subpath yet.
      when: "farmos_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `farmos_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if farmos_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          farmos_container_labels_traefik_path_prefix (`{{ farmos_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/farmos`).
      when: "farmos_container_labels_traefik_path_prefix != '/' and farmos_container_labels_traefik_path_prefix[-1] == '/'"
