---
- name: Fail if required SolidInvoice settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - solidinvoice_uid
    - solidinvoice_gid
    - solidinvoice_hostname
    - solidinvoice_path_prefix
    - solidinvoice_container_network
    - solidinvoice_database_type

- name: Fail if SolidInvoice database type is invalid
  ansible.builtin.fail:
    msg: >-
      solidinvoice_database_type must be 'mysql', 'postgres', or 'sqlite'.
  when: "solidinvoice_database_type not in ['mysql', 'postgres', 'sqlite']"

- name: Fail if required SolidInvoice + MySQL integration settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) when `solidinvoice_database_type` is `mysql`
  when: "solidinvoice_database_type == 'mysql' and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - solidinvoice_database_mysql_hostname
    - solidinvoice_database_mysql_password

- name: Fail if required SolidInvoice + Postgres integration settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`) when `solidinvoice_database_type` is `postgres`
  when: "solidinvoice_database_type == 'postgres' and lookup('vars', item, default='') | string | length == 0"
  with_items:
    - solidinvoice_database_postgres_hostname
    - solidinvoice_database_postgres_password

- name: Run if Traefik is enabled
  when: solidinvoice_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for SolidInvoice are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - solidinvoice_container_labels_traefik_hostname
        - solidinvoice_container_labels_traefik_path_prefix

    - name: Fail if solidinvoice_container_labels_traefik_path_prefix is different than /
      ansible.builtin.fail:
        msg: >-
          solidinvoice_container_labels_traefik_path_prefix (`{{ solidinvoice_container_labels_traefik_path_prefix }}`) must be `/`.
          SolidInvoice does not support hosting under a subpath yet.
      when: "solidinvoice_container_labels_traefik_path_prefix != '/'"

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `solidinvoice_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if solidinvoice_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          solidinvoice_container_labels_traefik_path_prefix (`{{ solidinvoice_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/solidinvoice`).
      when: "solidinvoice_container_labels_traefik_path_prefix != '/' and solidinvoice_container_labels_traefik_path_prefix[-1] == '/'"
