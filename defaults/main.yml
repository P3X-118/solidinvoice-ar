---
# Project source code URL: https://github.com/farmOS/farmOS

farmos_enabled: true

farmos_identifier: farmos
farmos_base_path: "/{{ farmos_identifier }}"

# `farmos_data_path` is used for storing data in mounted directories
farmos_data_path: "{{ farmos_base_path }}/data"
farmos_keys_path: "{{ farmos_data_path }}/keys"
farmos_sites_path: "{{ farmos_data_path }}/sites"

# renovate: datasource=docker depName=farmos/farmos versioning=semver
farmos_version: 3.4.5

farmos_uid: ""
farmos_gid: ""

farmos_scheme: https

# The hostname at which farmOS is served.
farmos_hostname: ""

# The path at which farmOS is exposed.
# This value must either be `/` or not end with a slash (e.g. `/farmos`).
#
# Hosting farmOS under a subpath does not seem to be possible due to farmOS's
# technical limitations.
farmos_path_prefix: /

farmos_container_image: "{{ farmos_container_image_registry_prefix }}farmos/farmos:{{ farmos_container_image_tag }}"
farmos_container_image_tag: "{{ farmos_version }}"
farmos_container_image_registry_prefix: "{{ farmos_container_image_registry_prefix_upstream }}"
farmos_container_image_registry_prefix_upstream: "{{ farmos_container_image_registry_prefix_upstream_default }}"
farmos_container_image_registry_prefix_upstream_default: docker.io/
farmos_container_image_force_pull: "{{ farmos_container_image.endswith(':latest') }}"

farmos_container_image_self_build: false
farmos_container_image_self_build_name: "farmos/farmos:{{ farmos_container_image_self_build_repo_version }}"
farmos_container_image_self_build_repo: "https://github.com/farmOS/farmOS.git"
farmos_container_image_self_build_repo_version: "{{ farmos_version if farmos_version != 'latest' else 'main' }}"
farmos_container_image_self_build_src_files_path: "{{ farmos_base_path }}/docker-src"

# Controls whether the container exposes its HTTP port (tcp/80 in the container).
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
farmos_container_http_host_bind_port: ""

# The base container network. It will be auto-created by this role if it doesn't exist already.
farmos_container_network: "{{ farmos_identifier }}"

# The port number in the container
farmos_container_http_port: 80

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
# Use this to expose this container to another reverse proxy, which runs in a different container network.
farmos_container_additional_networks: "{{ farmos_container_additional_networks_auto + farmos_container_additional_networks_custom }}"
farmos_container_additional_networks_auto: []
farmos_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
farmos_container_additional_volumes: "{{ farmos_container_additional_volumes_auto + farmos_container_additional_volumes_custom }}"
farmos_container_additional_volumes_auto: []
farmos_container_additional_volumes_custom: []

# farmos_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `farmos_container_labels_additional_labels`.
farmos_container_labels_traefik_enabled: true
farmos_container_labels_traefik_docker_network: "{{ farmos_container_network }}"
farmos_container_labels_traefik_hostname: "{{ farmos_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/farmos`).
farmos_container_labels_traefik_path_prefix: "{{ farmos_path_prefix }}"
farmos_container_labels_traefik_rule: "Host(`{{ farmos_container_labels_traefik_hostname }}`){% if farmos_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ farmos_container_labels_traefik_path_prefix }}`){% endif %}"
farmos_container_labels_traefik_priority: 0
farmos_container_labels_traefik_entrypoints: web-secure
farmos_container_labels_traefik_tls: "{{ farmos_container_labels_traefik_entrypoints != 'web' }}"
farmos_container_labels_traefik_tls_certResolver: default  # noqa var-naming

# Controls which additional headers to attach to all HTTP requests.
# To add your own custom request headers, use `farmos_container_labels_traefik_additional_request_headers_custom`
farmos_container_labels_traefik_additional_request_headers: "{{ farmos_container_labels_traefik_additional_request_headers_auto | combine(farmos_container_labels_traefik_additional_request_headers_custom) }}"
farmos_container_labels_traefik_additional_request_headers_auto: {}
farmos_container_labels_traefik_additional_request_headers_custom: {}

# Controls which additional headers to attach to all HTTP responses.
# To add your own custom response headers, use `farmos_container_labels_traefik_additional_response_headers_custom`
farmos_container_labels_traefik_additional_response_headers: "{{ farmos_container_labels_traefik_additional_response_headers_auto | combine(farmos_container_labels_traefik_additional_response_headers_custom) }}"
farmos_container_labels_traefik_additional_response_headers_auto: |
  {{
    {}
    | combine ({'X-XSS-Protection': farmos_http_header_xss_protection} if farmos_http_header_xss_protection else {})
    | combine ({'X-Content-Type-Options': farmos_http_header_content_type_options} if farmos_http_header_content_type_options else {})
    | combine ({'Content-Security-Policy': farmos_http_header_content_security_policy} if farmos_http_header_content_security_policy else {})
    | combine ({'Permissions-Policy': farmos_http_header_permissions_policy} if farmos_http_header_permissions_policy else {})
    | combine ({'Strict-Transport-Security': farmos_http_header_strict_transport_security} if farmos_http_header_strict_transport_security and farmos_container_labels_traefik_tls else {})
  }}
farmos_container_labels_traefik_additional_response_headers_custom: {}

# farmos_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
#
# Example:
# farmos_container_labels_additional_labels: |
#   my.label=1
#   another.label="here"
farmos_container_labels_additional_labels: ""

# A list of extra arguments to pass to the container (`docker run` command)
farmos_container_extra_arguments: []

# Specifies the value of the `X-XSS-Protection` header
# Stops pages from loading when they detect reflected cross-site scripting (XSS) attacks.
#
# Learn more about it is here:
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-XSS-Protection
# - https://portswigger.net/web-security/cross-site-scripting/reflected
farmos_http_header_xss_protection: "1; mode=block"

# Specifies the value of the `X-Content-Type-Options` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options
farmos_http_header_content_type_options: nosniff

# Specifies the value of the `Content-Security-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy
farmos_http_header_content_security_policy: frame-ancestors 'self'

# Specifies the value of the `Permissions-Policy` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Permissions-Policy
farmos_http_header_permissions_policy: "{{ 'interest-cohort=()' if farmos_floc_optout_enabled else '' }}"

# Specifies the value of the `Strict-Transport-Security` header.
# See: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
farmos_http_header_strict_transport_security: "max-age=31536000; includeSubDomains{{ '; preload' if farmos_hsts_preload_enabled else '' }}"

# Controls whether to send a "Permissions-Policy interest-cohort=();" header along with all responses
#
# Learn more about what it is here:
# - https://www.eff.org/deeplinks/2021/03/googles-floc-terrible-idea
# - https://paramdeo.com/blog/opting-your-website-out-of-googles-floc-network
# - https://amifloced.org/
#
# Of course, a better solution is to just stop using browsers (like Chrome), which participate in such tracking practices.
# See: `farmos_http_header_permissions_policy`
farmos_floc_optout_enabled: true

# Controls if HSTS preloading is enabled
#
# In its strongest and recommended form, the [HSTS policy](https://www.chromium.org/hsts) includes all subdomains, and
# indicates a willingness to be "preloaded" into browsers:
# `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`
# For more information visit:
# - https://en.wikipedia.org/wiki/HTTP_Strict_Transport_Security
# - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
# - https://hstspreload.org/#opt-in
# See: `farmos_http_header_strict_transport_security`
farmos_hsts_preload_enabled: false

# List of systemd services that the farmOS systemd service depends on
farmos_systemd_required_services_list: "{{ farmos_systemd_required_services_list_default + farmos_systemd_required_services_list_auto + farmos_systemd_required_services_list_custom }}"
farmos_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
farmos_systemd_required_services_list_auto: []
farmos_systemd_required_services_list_custom: []

# List of systemd services that the farmOS systemd service wants
farmos_systemd_wanted_services_list: "{{ farmos_systemd_wanted_services_list_default + farmos_systemd_wanted_services_list_auto + farmos_systemd_wanted_services_list_custom }}"
farmos_systemd_wanted_services_list_default: []
farmos_systemd_wanted_services_list_auto: []
farmos_systemd_wanted_services_list_custom: []

# Specify a database driver to use
# Valid values: mysql, postgres, sqlite
farmos_database_type: ""

# Specify database configuration
farmos_database_mysql_hostname: ""
farmos_database_mysql_port: 3306
farmos_database_mysql_username: farmos
farmos_database_mysql_password: ""
farmos_database_postgres_hostname: ""
farmos_database_postgres_port: 5432
farmos_database_postgres_username: farmos
farmos_database_postgres_password: ""
farmos_database_name: farmos

farmos_environment_variables_tz: UTC

# Additional environment variables.
farmos_environment_variables_additional_variables: ""
